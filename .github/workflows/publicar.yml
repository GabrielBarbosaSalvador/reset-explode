name: Publicar

# A cada push na main, gera o ResetExplode.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.12), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      # Só assina se os secrets SIGN_PFX_BASE64 / SIGN_PFX_SENHA existirem (veja assinatura/LEIA-ME.md)
      - name: Assinar
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          RESET_SIGN_PFX_SENHA: ${{ secrets.SIGN_PFX_SENHA }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host 'Sem certificado configurado; o .exe vai sem assinatura.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'assinatura.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $env:RESET_SIGN_PFX = $pfx
          try { & ./assinatura/assinar.ps1 -Arquivo dist/ResetExplode.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          finally { Remove-Item $pfx -Force }
          $c = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2((Get-AuthenticodeSignature dist/ResetExplode.exe).SignerCertificate)
          [IO.File]::WriteAllBytes('dist/ResetExplode.cer', $c.Export('Cert'))
          Copy-Item assinatura/instalar-certificado.bat dist/

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path (Get-ChildItem dist -File | Where-Object Extension -in '.exe', '.txt', '.cer', '.bat').FullName -DestinationPath ResetExplode.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release delete latest --cleanup-tag --yes
          gh release create latest ResetExplode.zip dist/ResetExplode.exe --target $env:GITHUB_SHA --latest --title "RESET EXPLODE (versão mais recente)" --notes-file NOVIDADES.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME ResetExplode.zip dist/ResetExplode.exe --title "RESET EXPLODE $env:GITHUB_REF_NAME" --generate-notes --latest=false
